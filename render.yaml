services:
  - type: web
    name: agentflow-api
    runtime: python
    rootDir: agentflow/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: LLM_PROVIDER
        value: auto
      - key: FORCE_OFFLINE
        value: "false"
      - key: DATABASE_URL
        value: sqlite:///./agentflow.db
      - key: CORS_ORIGINS
        value: "*"
      - key: USER_GEMINI_API_KEY
        sync: false
      - key: USER_GEMINI_MODEL
        value: gemini-2.0-flash
      - key: USER_LLM_API_KEY
        sync: false
      - key: USER_LLM_BASE_URL
        value: https://api.deepseek.com/v1
      - key: USER_LLM_MODEL
        value: deepseek-chat

  - type: web
    name: agentflow-web
    runtime: node
    rootDir: agentflow/frontend
    buildCommand: npm ci && npm run build
    startCommand: npx next start --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: BACKEND_HOST
        fromService:
          name: agentflow-api
          type: web
          property: host
